<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    
    /* Background Dynamic Elements (Pulsing / Floating) */
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(15px) rotate(-2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse-bg {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    
    .floating-card-1 { animation: float1 6s ease-in-out infinite; }
    .floating-card-2 { animation: float2 8s ease-in-out infinite; }
    .pulsing-glow { animation: pulse-bg 4s ease-in-out infinite; }
  </style>

  <!-- Dark Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg)"/>

  <!-- Dynamic Background Ambient Glow Orbs (Behind content) -->
  <circle cx="200" cy="100" r="120" fill="#4f46e5" opacity="0.25" class="pulsing-glow" filter="url(#glow)"/>
  <circle cx="1000" cy="250" r="140" fill="#c084fc" opacity="0.2" class="pulsing-glow" filter="url(#glow)"/>

  <!-- Subtle Dynamic Floating Background UI Cards (Positioned lower/side to NOT overlap foreground title) -->
  <g class="floating-card-1" opacity="0.6">
    <rect x="850" y="40" width="280" height="80" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="880" cy="80" r="16" fill="#10b981" opacity="0.8"/>
    <rect x="910" y="68" width="140" height="10" rx="5" fill="#e2e8f0" opacity="0.8"/>
    <rect x="910" y="85" width="90" height="8" rx="4" fill="#64748b" opacity="0.6"/>
  </g>

  <g class="floating-card-2" opacity="0.5">
    <rect x="880" y="220" width="260" height="75" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <circle cx="910" cy="257" r="14" fill="#6366f1" opacity="0.8"/>
    <rect x="935" y="247" width="120" height="8" rx="4" fill="#e2e8f0" opacity="0.7"/>
    <rect x="935" y="262" width="70" height="6" rx="3" fill="#64748b" opacity="0.5"/>
  </g>

  <!-- Decor Accent Line -->
  <rect x="80" y="60" width="180" height="4" rx="2" fill="url(#accent)"/>

  <!-- FOREGROUND CONTENT (Guaranteed Unhidden & Clear) -->
  <g transform="translate(80, 0)">
    <!-- Main Title -->
    <text x="0" y="125" class="title">Awesome Clinical Trial eConsent</text>
    
    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle">Top SaaS Platforms, Ecosystem Analytics &amp; Open-Source Projects</text>
    <text x="0" y="195" class="subtitle" font-size="16px" fill="#64748b">21 CFR Part 11 • ICH-GCP • Patient Comprehension • Remote Consenting</text>

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="23" class="badge-text">⚡ SaaS Platforms</text>
      
      <!-- Pill 2 -->
      <rect x="175" y="0" width="175" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="195" y="23" class="badge-text">🔓 Open-Source Repos</text>

      <!-- Pill 3 -->
      <rect x="365" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="385" y="23" class="badge-text">📊 Market Analytics</text>
    </g>
  </g>
</svg>
